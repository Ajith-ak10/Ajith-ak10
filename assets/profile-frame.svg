<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Circular Avatar Clip Mask -->
    <clipPath id="avatarClip">
      <circle cx="150" cy="150" r="108" />
    </clipPath>

    <!-- Ring Gradients (Dark Navy / Blue / Purple developer theme) -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="glassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="#1e1b4b" stop-opacity="0" />
      <stop offset="92%" stop-color="#4f46e5" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Rotating Animated Flowing Light Rings */
      .ring-rotate {
        transform-origin: 150px 150px;
        animation: rotateClockwise 12s linear infinite;
      }
      .ring-rotate-rev {
        transform-origin: 150px 150px;
        animation: rotateCounter 18s linear infinite;
      }
      .pulse-glow {
        animation: pulseRing 4s ease-in-out infinite alternate;
      }

      @keyframes rotateClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateCounter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseRing {
        0% { opacity: 0.55; }
        50% { opacity: 0.95; }
        100% { opacity: 0.6; }
      }

      /* Minimal Drifting Particles Around the Ring */
      .particle-orbit-1 {
        transform-origin: 150px 150px;
        animation: rotateClockwise 20s linear infinite;
      }
      .particle-orbit-2 {
        transform-origin: 150px 150px;
        animation: rotateCounter 25s linear infinite;
      }
      .particle-twinkle {
        animation: twinkle 3s ease-in-out infinite alternate;
      }
      @keyframes twinkle {
        0% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.2); }
        100% { opacity: 0.35; transform: scale(0.9); }
      }
    </style>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="150" cy="150" r="122" fill="url(#glassGlow)" />

  <!-- Outer Subtle Tech Dashed Ring -->
  <g class="ring-rotate-rev">
    <circle cx="150" cy="150" r="123" fill="none" stroke="url(#ringGrad2)" stroke-width="1.2" stroke-dasharray="6 14" opacity="0.65" />
    <circle cx="150" cy="27" r="1.8" fill="#38bdf8" />
    <circle cx="150" cy="273" r="1.8" fill="#a855f7" />
    <circle cx="27" cy="150" r="1.8" fill="#818cf8" />
    <circle cx="273" cy="150" r="1.8" fill="#38bdf8" />
  </g>

  <!-- Primary Flowing Gradient Animated Ring -->
  <g class="ring-rotate">
    <circle cx="150" cy="150" r="115" fill="none" stroke="url(#ringGrad1)" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="160 30 140 40" class="pulse-glow" filter="url(#softGlow)" />
    <!-- Orbiting Leading Light Sparks -->
    <circle cx="150" cy="35" r="3.2" fill="#e0f2fe" filter="url(#softGlow)" />
    <circle cx="150" cy="35" r="1.8" fill="#ffffff" />
    <circle cx="265" cy="150" r="2.8" fill="#a855f7" filter="url(#softGlow)" />
  </g>

  <!-- Secondary Counter-Flowing Thin Accent Ring -->
  <g class="ring-rotate-rev">
    <circle cx="150" cy="150" r="111.5" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="40 80 50 60" />
  </g>

  <!-- Profile Image Presentation (Clipped into circle) -->
  <g>
    <!-- Background backing behind photo for smooth border blend -->
    <circle cx="150" cy="150" r="108" fill="#090d1a" />
    
    <!-- Exact Original Photo -->
    <image xlink:href="profile.jpg" href="profile.jpg" x="38" y="24" width="224" height="252" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)" />
    
    <!-- Clean Inner Glassmorphism Rim -->
    <circle cx="150" cy="150" r="108" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
    <circle cx="150" cy="150" r="107" fill="none" stroke="#000000" stroke-opacity="0.3" stroke-width="1" />
  </g>

  <!-- Minimal Orbiting Starlight Particles Around Ring -->
  <g class="particle-orbit-1">
    <circle cx="150" cy="18" r="1.8" fill="#38bdf8" class="particle-twinkle" />
    <circle cx="238" cy="62" r="1.4" fill="#c084fc" />
    <circle cx="282" cy="150" r="1.6" fill="#818cf8" class="particle-twinkle" />
    <circle cx="62" cy="238" r="1.5" fill="#38bdf8" />
    <circle cx="18" cy="150" r="1.4" fill="#e0e7ff" class="particle-twinkle" />
  </g>

  <g class="particle-orbit-2">
    <circle cx="245" cy="210" r="1.6" fill="#818cf8" />
    <circle cx="55" cy="90" r="1.8" fill="#c084fc" class="particle-twinkle" />
    <circle cx="190" cy="280" r="1.4" fill="#38bdf8" />
    <circle cx="110" cy="20" r="1.5" fill="#e0e7ff" />
  </g>
</svg>
